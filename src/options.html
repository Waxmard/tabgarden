<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>tabgarden options</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 480px; margin: 2em; }
      label { display: block; margin-top: 12px; }
      input, select, textarea { display: block; width: 100%; box-sizing: border-box; }
      small { color: #666; }
    </style>
  </head>
  <body>
    <label>Provider
      <select id="provider">
        <option value="openai">OpenAI-compatible</option>
        <option value="gemini">Gemini (AI Studio / Vertex express)</option>
      </select>
    </label>
    <label>Base URL <input id="baseUrl" type="text" /></label>
    <label>API key <input id="apiKey" type="password" /></label>
    <label>Model <input id="model" type="text" /></label>
    <label>Categories
      <textarea id="categories" rows="5"></textarea>
      <small>Optional. Preferred group names, one per line.</small>
    </label>
    <p><button id="save">Save</button> <span id="saved"></span></p>
    <script type="module" src="options.js"></script>
  </body>
</html>
